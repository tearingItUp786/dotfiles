set -g default-terminal "screen-256color"

set -g allow-passthrough all

set -g prefix C-a
set -sg escape-time 0  # Remove delay when hitting escape

unbind-key C-b
bind-key C-a send-prefix
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

unbind C-\\

unbind r
bind r source-file ~/.tmux.conf


set-window-option -g mode-keys vi
set -g pane-border-status top

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# bind -r l switch-client -l

bind -r m resize-pane -Z




# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# THEMES
# set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
# set -g @themepack 'powerline/default/cyan' # use this theme for tmux
set -g @plugin 'dracula/tmux'

# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, network, network-bandwidth, network-ping, weather, time
set -g @dracula-plugins "git cpu-usage ram-usage battery network time"
set -g @dracula-military-time true



# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality
set -g @plugin 'tmux-plugins/tmux-yank'

set -g renumber-windows on # renumber windows when a window is closed

# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Default: local tmux mode
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough off
set -g @herder_mode 0
set -gq -u @herdr_mode
set -gq -u @herdr_remote_mode
bind-key -T prefix [ copy-mode
unbind-key -q -T prefix L
unbind-key -q -T prefix C-l

# Prefix + H toggles Local tmux mode <-> Herder mode
bind H if -F '#{==:#{@herder_mode},1}' \
  'set -g mouse on; set -g set-clipboard on; set -g allow-passthrough off; bind-key -T prefix [ copy-mode; set -g @herder_mode 0; display-message "Local tmux mode: prefix-[ copy-mode ON"' \
  'set -g mouse off; set -g set-clipboard off; set -g allow-passthrough on; unbind-key -q -T prefix [; set -g @herder_mode 1; display-message "Herder mode: tmux mouse/copy-mode OFF"'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
