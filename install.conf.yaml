- defaults:
    link:
      create: true
      relink: true

- clean: ["~"]

- link:
    ~/.profile: profile
    ~/.gitconfig: gitconfig
    ~/.tmux.conf: tmux.conf
    ~/.zprofile: zprofile
    ~/.zshrc: zshrc
    ~/.config/nvim: nvim
    ~/.config/home: nvim-home
    ~/.config/work: nvim-work
    ~/Desktop/editor-cheatsheet.md: editor-cheatsheet.md
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/ghostty/config: ghostty.conf
    ~/.config/opencode/AGENTS.md: AGENTS.md

- shell:
  - 
     command: ./setup_homebrew.sh
     description: Install packages from Brewfile
     stdin: true
     stdout: true
     stderr: true


